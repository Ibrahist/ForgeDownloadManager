[package]
name = "forgedownloadmanager-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Segmented download engine for Forge Download Manager"
readme = "../../README.md"

[dependencies]
futures-util = "0.3.34"
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
hex = "0.4.3"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { workspace = true }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

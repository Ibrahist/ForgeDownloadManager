# Separate workspace so `cargo test --workspace` at the repo root does not
# compile the WebView shell. That keeps the GNU engine tests and the Linux
# engine CI job independent of webkit2gtk.
[workspace]

[package]
name = "forgedownloadmanager-desktop"
version = "0.1.0"
description = "Forge Download Manager desktop shell"
authors = ["Forge Download Manager contributors"]
license = "MIT"
repository = "https://github.com/Ibrahist/ForgeDownloadManager"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "forge-dm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
forgedownloadmanager-core = { path = "../../../crates/forgedownloadmanager-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `dbus` is a default Tauri feature. Leave it off so the shell does not link
# the dbus crate. The window does not use a tray icon or D-Bus activation.
tauri = { version = "2.12.4", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
